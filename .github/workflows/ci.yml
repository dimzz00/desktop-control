name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # go.mod targets the language version 1.23, but the pinned linters in
      # `make tools` need a Go 1.26+ toolchain to build, so CI uses 1.27.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Install pinned lint tools
        run: make tools
      - name: Verify
        run: make verify

  windows:
    name: build and test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # go.mod targets the language version 1.23, but the pinned linters in
      # `make tools` need a Go 1.26+ toolchain to build, so CI uses 1.27.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...
